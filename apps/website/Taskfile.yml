version: "3"

# .env (gitignored) holds CLOUDFLARE_API_TOKEN — required by deploy:cf.
# Mirrors the convention used by khanakia_com/sql-schema-visualizer.
dotenv: ['.env']

# Run from apps/website. Packages must be built first if @filemark/mdx
# changed (`task build:packages` at the repo root).

tasks:
  dev:
    desc: Vite dev server (HMR) at http://localhost:5173
    cmds:
      - pnpm exec vite

  build:
    desc: Production build → dist/ (base=/apps/filemark/)
    cmds:
      - pnpm exec vite build

  preview:
    desc: Serve the production build locally
    cmds:
      - pnpm exec vite preview

  typecheck:
    desc: Type-check without emitting
    cmds:
      - pnpm exec tsc --noEmit

  # WHY build:cf — the edge gateway forwards khanakia.com/apps/filemark/*
  # UNCHANGED. The origin must serve at exactly /apps/filemark/. Vite
  # `base` makes asset URLs absolute under that path; this task physically
  # nests dist/ under dist-cf/apps/filemark/ so the file layout matches.
  build:cf:
    desc: Build + nest under dist-cf/apps/filemark/ for Cloudflare
    cmds:
      - pnpm exec vite build
      - rm -rf dist-cf
      - mkdir -p dist-cf/apps/filemark
      - cp -R dist/. dist-cf/apps/filemark/
      # SPA fallback: Cloudflare Static Assets serves /index.html when a
      # path 404s. Our real index is nested at /apps/filemark/index.html,
      # so duplicate it at the top so deep links like /apps/filemark/privacy
      # fall back correctly. Assets inside the copied index reference
      # /apps/filemark/assets/* (vite base), which work from either path.
      - cp dist/index.html dist-cf/index.html

  deploy:cf:
    desc: Build + deploy to Cloudflare Workers Static Assets (CLOUDFLARE_API_TOKEN from .env)
    preconditions:
      - sh: '[ -n "$CLOUDFLARE_API_TOKEN" ]'
        msg: "CLOUDFLARE_API_TOKEN not set. Copy .env.example to .env and add the token."
    cmds:
      - task: build:cf
      - pnpm exec wrangler deploy
      - 'echo "Deployed. Verify: curl -sI https://filemark.aman-f4d.workers.dev/apps/filemark/ | head -1"'
