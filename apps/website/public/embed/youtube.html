<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Nested https helper for YouTube embeds.

      Why this file exists: YouTube's player returns "Error 153 — Video player
      configuration error" unless the embedding page sends a valid http(s)
      `Referer`. filemark's non-website hosts — the Chrome extension
      (chrome-extension://), the VS Code webview (vscode-webview://), and local
      file:// docs — cannot produce one, so a direct YouTube iframe there always
      153s (regardless of the video). Those hosts iframe THIS page instead, which
      is served from https://khanakia.com; YouTube then sees a real https Referer
      and plays. The `referrer` meta below is what actually satisfies YouTube.

      Consumer + full explanation:
      packages/mdx-viewer/src/components/VideoEmbed.tsx
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>YouTube — Filemark embed</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      .wrap {
        position: fixed;
        inset: 0;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .msg {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 1rem;
        text-align: center;
        color: #bbb;
        font: 14px/1.5 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap"></div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var v = params.get("v") || "";
        var wrap = document.getElementById("wrap");

        // Only ever accept a well-formed YouTube id — never reflect arbitrary
        // query input into the DOM or the iframe src (XSS / open-redirect
        // guard). YouTube ids are 11 chars; allow a small range for safety.
        if (!/^[A-Za-z0-9_-]{6,15}$/.test(v)) {
          wrap.className = "msg";
          wrap.textContent = "Missing or invalid ?v= YouTube video id.";
          return;
        }

        // Optional start offset in whole seconds (?t=90).
        var t = params.get("t");
        var startParam = t && /^\d{1,6}$/.test(t) ? "&start=" + t : "";

        var src =
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(v) +
          "?rel=0&modestbranding=1&playsinline=1" +
          startParam;

        var f = document.createElement("iframe");
        f.src = src;
        f.title = "YouTube video";
        f.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        f.setAttribute("allowfullscreen", "");
        f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
        wrap.appendChild(f);
      })();
    </script>
  </body>
</html>
