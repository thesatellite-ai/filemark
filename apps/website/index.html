<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0a0a" />

    <title>Filemark — Markdown, MDX, JSON, CSV & schema viewer for Chrome</title>
    <meta
      name="description"
      content="The Chrome extension that opens local .md, .mdx, .json, .csv, .tsv, .sql, .prisma and .dbml files with real, interactive renderers. Tabs, search, themes, kanban from markdown — entirely client-side."
    />
    <meta
      name="keywords"
      content="markdown viewer, mdx viewer, json viewer, csv viewer, sql schema, prisma, dbml, chrome extension, file viewer"
    />
    <meta name="author" content="khanakia" />
    <link rel="canonical" href="https://khanakia.com/apps/filemark/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="khanakia.com" />
    <meta property="og:title" content="Filemark — Markdown, MDX, JSON, CSV & schema viewer for Chrome" />
    <meta
      property="og:description"
      content="Open any local .md / .mdx / .json / .csv / .sql in Chrome with a real renderer. Tabs, search, themes, kanban from markdown. 100% client-side."
    />
    <meta property="og:url" content="https://khanakia.com/apps/filemark/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Filemark" />
    <meta
      name="twitter:description"
      content="Real in-browser viewer for markdown, MDX, JSON, CSV, SQL/Prisma/DBML. Free, open source, 100% client-side."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Filemark",
        "url": "https://khanakia.com/apps/filemark/",
        "description": "Chrome extension that renders local markdown, MDX, JSON, CSV, TSV, SQL, Prisma and DBML files with rich interactive components. Tabs, search, themes, kanban from markdown — entirely client-side.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Chrome",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": {
          "@type": "Person",
          "name": "khanakia",
          "url": "https://github.com/khanakia"
        }
      }
    </script>
  </head>
  <body>
    <!-- Crawler / no-JS fallback. React replaces #root on mount. -->
    <div id="root">
      <main style="max-width:48rem;margin:8vh auto;padding:0 1.5rem;font:16px/1.7 system-ui,-apple-system,sans-serif;color:#111">
        <h1 style="font-size:2rem;margin:0 0 .5rem">Filemark</h1>
        <p style="font-size:1.15rem;color:#444;margin:0 0 1.25rem">
          The Chrome extension that opens local <code>.md</code>, <code>.mdx</code>, <code>.json</code>, <code>.csv</code>, <code>.tsv</code>, <code>.sql</code>, <code>.prisma</code> and <code>.dbml</code> files with real, interactive renderers — entirely in your browser.
        </p>
        <p style="color:#666">Loading the interactive site…</p>
        <noscript>
          <p style="color:#b00">This page needs JavaScript. The site is entirely client-side — nothing is sent to a server.</p>
        </noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
