<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 440px; height: 280px; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
        color: #0a0a0a;
        background:
          radial-gradient(120% 80% at 50% 0%, #f6f8fb 0%, #ffffff 60%, #ffffff 100%);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .tile {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px 24px;
        border: 1px solid #e5e7eb;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 28px; height: 28px;
        display: block;
      }
      .name {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .pill {
        margin-left: auto;
        font-size: 9.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #6b7280;
        border: 1px solid #e5e7eb;
        padding: 4px 8px;
        border-radius: 999px;
        background: #fff;
      }
      .pill .dot {
        display: inline-block;
        width: 5px; height: 5px;
        border-radius: 50%;
        background: #10b981;
        margin-right: 5px;
        vertical-align: 1px;
      }
      .headline {
        font-size: 26px;
        line-height: 1.1;
        letter-spacing: -0.022em;
        font-weight: 600;
        max-width: 360px;
      }
      .headline .sub {
        display: block;
        background: linear-gradient(180deg, #0a0a0a 0%, rgba(10,10,10,0.55) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .formats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .chip {
        font-family: ui-monospace, SFMono-Regular, "Geist Mono", "JetBrains Mono", Menlo, monospace;
        font-size: 11px;
        font-weight: 600;
        color: #0a0a0a;
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 5px 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="top">
        <svg class="logo" viewBox="0 0 32 32" aria-label="Filemark">
          <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
          <path d="M8 8h12l4 4v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M20 8v4h4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M10 17h8M10 21h6" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div class="name">Filemark</div>
        <div class="pill"><span class="dot"></span>Local-first</div>
      </div>

      <div class="headline">
        Every file Chrome
        <span class="sub">should already open.</span>
      </div>

      <div class="formats">
        <div class="chip">.md</div>
        <div class="chip">.json</div>
        <div class="chip">.csv</div>
        <div class="chip">.sql</div>
        <div class="chip">.prisma</div>
      </div>
    </div>
  </body>
</html>
